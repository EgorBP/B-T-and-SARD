<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Загрузка трека — SpotX</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">X</div>
        <div class="site-title">
          <h1>SpotX</h1>
          <p>Загрузка трека</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="small-btn" href="/profile">Назад в профиль</a>
      </div>
    </header>

    <main class="card" style="max-width:720px;">
      <h2>Добавить новый трек</h2>
      <form action="/upload" method="post" enctype="multipart/form-data" class="upload-form">
        <input class="input" name="title" placeholder="Название трека" required />
        <input class="file-input" type="file" name="file" accept="audio/*" required />
        <button class="upload-btn" type="submit">Загрузить</button>
      </form>
    </main>
  </div>
</body>
</html>
