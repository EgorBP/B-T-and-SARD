<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Восстановление пароля — SpotX</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">X</div>
        <div class="site-title">
          <h1>SpotX</h1>
          <p>Восстановление пароля</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="small-btn" href="/auth/login">Вход</a>
        <a class="small-btn" href="/auth/register">Регистрация</a>
      </div>
    </header>

    <main class="card" style="max-width:640px;">
      <h2>Сброс пароля</h2>

      <form method="post" action="/auth/forgot-password" class="upload-form">
        <input class="input" name="email" type="email" placeholder="Email" value="{{ form_email or '' }}" required />
        <input class="input" name="recovery_phrase" placeholder="Секретная фраза" value="{{ form_recovery_phrase or '' }}" required />
        <input class="input" name="new_password" type="password" placeholder="Новый пароль (минимум 6 символов)" required />
        <button class="upload-btn" type="submit">Сменить пароль</button>
        {% if error %}
          <p style="margin-top:8px; color:#fca5a5; font-size:14px;">{{ error }}</p>
        {% endif %}
      </form>
    </main>
  </div>
</body>
</html>
