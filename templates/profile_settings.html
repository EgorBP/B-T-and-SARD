<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Настройки профиля — SpotX</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">X</div>
        <div class="site-title">
          <h1>SpotX</h1>
          <p>Настройки профиля</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="small-btn" href="/profile">Назад в профиль</a>
      </div>
    </header>

    <main class="card" style="max-width:720px;">
      <h2>Изменить данные профиля</h2>

      <form method="post" action="/profile/settings" enctype="multipart/form-data" class="upload-form">
        <input class="input" name="email" type="email" value="{{ user.email }}" placeholder="Email" required />
        <input class="input" name="name" value="{{ user.name }}" placeholder="Имя" required />
        <input class="input" name="recovery_phrase" value="{{ user.recovery_phrase }}" placeholder="Секретная фраза" required />
        <input class="input" name="password" type="password" placeholder="Новый пароль (оставьте пустым, если без изменений)" />
        <label style="color:var(--muted); font-size:13px;">Новый аватар (jpg/png/webp/gif)</label>
        <input class="file-input" type="file" name="avatar" accept="image/*" />
        <button class="upload-btn" type="submit">Сохранить изменения</button>
      </form>

      {% if error %}
      <p style="margin-top:10px; color:#fca5a5; font-size:14px;">{{ error }}</p>
      {% endif %}
    </main>
  </div>
</body>
</html>
