<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Вход — SpotX</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">X</div>
        <div class="site-title">
          <h1>SpotX</h1>
          <p>Вход в аккаунт</p>
        </div>
      </div>
      <div><a class="small-btn" href="/auth/register">Нет аккаунта? Регистрация</a></div>
    </header>

    <main class="card" style="max-width:640px;">
      <h2>Вход</h2>

      <form method="post" action="/auth/login" class="upload-form">
        <input class="input" name="email" type="email" placeholder="Email" value="{{ form_email or '' }}" required />
        <input class="input" name="password" type="password" placeholder="Пароль" required />
        <button class="upload-btn" type="submit">Войти</button>
        {% if error %}
          <p style="margin-top:8px; color:#fca5a5; font-size:14px;">{{ error }}</p>
        {% endif %}
      </form>
    </main>

    <aside class="sidebar">
      <div class="card">
        <p style="color:var(--muted);">После успешного входа вы будете перенаправлены на приватную страницу профиля.</p>
      </div>
    </aside>
  </div>
</body>
</html>
