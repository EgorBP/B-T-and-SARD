<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Регистрация — SpotX</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <div class="logo">X</div>
        <div class="site-title">
          <h1>SpotX</h1>
          <p>Создайте аккаунт</p>
        </div>
      </div>
      <div class="header-actions">
        <a class="small-btn" href="/auth/login">Уже есть аккаунт? Войти</a>
        <a class="small-btn" href="/auth/forgot-password">Забыли пароль?</a>
      </div>
    </header>

    <main class="card" style="max-width:640px;">
      <h2>Регистрация</h2>

      <form method="post" action="/auth/register" class="upload-form">
        <input class="input" name="email" type="email" placeholder="Email" value="{{ form_email or '' }}" required />
        <input class="input" name="name" placeholder="Имя" value="{{ form_name or '' }}" required />
        <input class="input" name="password" type="password" placeholder="Пароль (минимум 6 символов)" required />
        <button class="upload-btn" type="submit">Зарегистрироваться</button>
        {% if error %}
          <p style="margin-top:8px; color:#fca5a5; font-size:14px;">{{ error }}</p>
        {% endif %}
      </form>
    </main>

    <aside class="sidebar">
      <div class="card">
        <p style="color:var(--muted);">После регистрации вы будете автоматически авторизованы и перенаправлены в профиль.</p>
      </div>
    </aside>
  </div>
</body>
</html>
